name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kanban_user
          POSTGRES_PASSWORD: kanban_pass
          POSTGRES_DB: gamified_kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban_user -d gamified_kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: kanban_user
      DB_PASSWORD: kanban_pass
      DB_NAME: gamified_kanban
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173

    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Criar schema no Postgres
        run: PGPASSWORD="$DB_PASSWORD" psql -h localhost -U "$DB_USER" -d "$DB_NAME" -f init.sql

      - name: Testes
        run: npm test

  frontend:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
