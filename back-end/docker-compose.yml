version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gamified-kanban-db
    environment:
      POSTGRES_USER: ${DB_USER:-kanban_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kanban_pass}
      POSTGRES_DB: ${DB_NAME:-gamified_kanban}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kanban_user} -d ${DB_NAME:-gamified_kanban}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: